@switch (actual()) {
  @case (1) {
    <app-requirements-slide />
  }
  @case (2) {
    <app-erd-slide />
  }
  @case (3) {
    <app-architecture-slide />
  }
  @case (4) {
    <app-interface-slide />
  }
  @case (5) {
    <app-catalogo-slide />
  }
}

<nav class="deck" aria-label="Navegación de la presentación">
  <button
    type="button"
    class="paso"
    [disabled]="actual() === 1"
    (click)="ir(actual() - 1)"
    aria-label="Slide anterior"
  >‹</button>

  @for (s of slides; track s.n) {
    <button
      type="button"
      class="punto"
      [class.activo]="actual() === s.n"
      [title]="s.n + ' · ' + s.titulo"
      [attr.aria-current]="actual() === s.n"
      (click)="ir(s.n)"
    >
      <span class="etiqueta">{{ s.titulo }}</span>
    </button>
  }

  <button
    type="button"
    class="paso"
    [disabled]="actual() === slides.length"
    (click)="ir(actual() + 1)"
    aria-label="Slide siguiente"
  >›</button>
</nav>
